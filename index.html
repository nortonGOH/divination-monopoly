<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二十八禽星靈臺周天圖</title>
  <style>
    :root {
      --bg-color: #f7f3e8;
      --paper-card: #fdfbf7;
      --ink-base: #242424;
      --ink-muted: #595757;
      --border-dark: #3a3833;
      --border-light: #d8ceba;
      --gold-line: #a67c37;
      --red-accent: #9e2a2b;
      --spring-wood: #2d5a3f;
      --summer-fire: #a93226;
      --autumn-metal: #7d6608;
      --winter-water: #1b4f72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--ink-base);
      font-family: "PingFang TC", "Noto Serif TC", "Source Han Serif TC", "Songti TC", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 0.35rem;
      color: var(--ink-base);
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--ink-muted);
      letter-spacing: 0.15rem;
    }

    .astronomy-orientation-tip {
      font-size: 0.75rem;
      color: var(--gold-line);
      margin-top: 2px;
    }

    #board-container {
      position: relative;
      width: min(92vw, 680px);
      height: min(92vw, 680px);
      margin: 10px auto;
      border: 3px double var(--border-dark);
      background: var(--paper-card);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .grid-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--border-light);
      background: #faf7f0;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s, box-shadow 0.3s;
      padding: 2px;
    }

    .cell.targeted {
      background-color: #faeccf !important;
      box-shadow: inset 0 0 0 2px var(--gold-line);
    }

    .cell.spring { border-left: 3px solid var(--spring-wood); }
    .cell.summer { border-top: 3px solid var(--summer-fire); }
    .cell.autumn { border-right: 3px solid var(--autumn-metal); }
    .cell.winter { border-bottom: 3px solid var(--winter-water); }

    .cell-title {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.1rem;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .cell.spring .cell-title { color: var(--spring-wood); }
    .cell.summer .cell-title { color: var(--summer-fire); }
    .cell.autumn .cell-title { color: var(--autumn-metal); }
    .cell.winter .cell-title { color: var(--winter-water); }

    .player-token {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--red-accent);
      border: 2px solid #fff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
      bottom: 4px;
      right: 4px;
      display: none;
      z-index: 5;
    }

    .cell.has-token .player-token {
      display: block;
    }

    .center-stage {
      grid-column: 2 / span 6;
      grid-row: 2 / span 6;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px dashed var(--border-light);
      background: radial-gradient(circle at center, #ffffff 0%, #f5efe3 100%);
      overflow: hidden;
    }

    .compass-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .compass-dir {
      position: absolute;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--ink-muted);
      letter-spacing: 0.1rem;
    }
    .compass-dir.top { top: 6px; }
    .compass-dir.bottom { bottom: 6px; }
    .compass-dir.left { left: 8px; }
    .compass-dir.right { right: 8px; }

    #dipper-canvas {
      position: absolute;
      width: 86%;
      height: 86%;
      pointer-events: none;
    }

    .spin-trigger-btn {
      position: absolute;
      bottom: 24px;
      background: var(--paper-card);
      border: 2px solid var(--border-dark);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-base);
      letter-spacing: 0.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: background 0.2s, transform 0.1s;
      z-index: 10;
    }

    .spin-trigger-btn:hover {
      background: #ebdcc3;
    }

    .spin-trigger-btn:active {
      transform: scale(0.96);
    }

    .spin-trigger-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #dialog-overlay.active {
      display: flex;
    }

    .dialog-card {
      background: var(--paper-card);
      border: 2px solid var(--border-dark);
      width: min(90vw, 480px);
      padding: 24px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: dialogPop 0.25s ease-out;
    }

    @keyframes dialogPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .dialog-header {
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dialog-star-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink-base);
      letter-spacing: 0.15rem;
    }

    .dialog-quadrant {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .dialog-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink-base);
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .dialog-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: #f2ebd9;
      padding: 8px 10px;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }

    .dialog-close-btn {
      background: var(--ink-base);
      color: #fff;
      border: none;
      padding: 8px 24px;
      font-size: 0.9rem;
      letter-spacing: 0.15rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dialog-close-btn:hover {
      background: var(--red-accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>二十八禽星周天圖</h1>
    <p>斗衡定極 · 破軍指宿</p>
    <div class="astronomy-orientation-tip">【古天文象：上南朱雀、下北玄武、左東青龍、右西白虎】</div>
  </header>

  <div id="board-container">
    <div class="grid-board" id="board">
      <div class="center-stage">
        <svg class="compass-bg" viewBox="0 0 300 300">
          <circle cx="150" cy="150" r="140" fill="none" stroke="#e8dfcb" stroke-width="1.5" stroke-dasharray="4,4"/>
          <circle cx="150" cy="150" r="100" fill="none" stroke="#e8dfcb" stroke-width="1"/>
          <circle cx="150" cy="150" r="50" fill="none" stroke="#e8dfcb" stroke-width="0.8"/>
        </svg>

        <span class="compass-dir top">南（朱雀）</span>
        <span class="compass-dir bottom">北（玄武）</span>
        <span class="compass-dir left">東（青龍）</span>
        <span class="compass-dir right">西（白虎）</span>

        <svg id="dipper-canvas" viewBox="0 0 300 300">
          <!-- 貫通天璣-極星-天衡(玉衡)之子午樞紐直線（此直線不動） -->
          <line x1="150" y1="40" x2="150" y2="260" stroke="#a67c37" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

          <!-- 旋轉天盤：北斗七星繞不動之天極太乙旋動 -->
          <g id="rotary-plate">
            <!-- 天權與天璣不連線；斗魁連線：天樞-天璇-天璣，天樞-天權 -->
            <polyline points="110,65 85,115 150,115" fill="none" stroke="#4a4843" stroke-width="2"/>
            <line x1="110" y1="65" x2="150" y2="65" stroke="#4a4843" stroke-width="2"/>

            <!-- 斗杓連線：天權-天衡(玉衡)-開陽-搖光 -->
            <polyline points="150,65 150,185 175,230 215,265" fill="none" stroke="#4a4843" stroke-width="2"/>

            <!-- 搖光(破軍)指向光矢 -->
            <line x1="215" y1="265" x2="245" y2="295" stroke="#9e2a2b" stroke-width="2.5" stroke-dasharray="3,3"/>
            <circle cx="245" cy="295" r="3" fill="#9e2a2b"/>

            <!-- 北斗七星星體 -->
            <!-- 斗魁 -->
            <circle cx="110" cy="65" r="4" fill="#242424"/><text x="96" y="60" font-size="10" fill="#595757">天樞</text>
            <circle cx="85" cy="115" r="4" fill="#242424"/><text x="60" y="120" font-size="10" fill="#595757">天璇</text>
            <circle cx="150" cy="115" r="4.5" fill="#a67c37"/><text x="156" y="118" font-size="10" fill="#a67c37" font-weight="bold">天璣</text>
            <circle cx="150" cy="65" r="4" fill="#242424"/><text x="156" y="62" font-size="10" fill="#595757">天權</text>

            <!-- 斗杓 -->
            <circle cx="150" cy="185" r="4.5" fill="#a67c37"/><text x="156" y="190" font-size="10" fill="#a67c37" font-weight="bold">天衡</text>
            <circle cx="175" cy="230" r="4" fill="#242424"/><text x="182" y="234" font-size="10" fill="#595757">開陽</text>
            <circle cx="215" cy="265" r="5" fill="#9e2a2b"/><text x="210" y="285" font-size="11" fill="#9e2a2b" font-weight="bold">搖光·破軍</text>
          </g>

          <!-- 北極星：居天心中宮，恆定不動，天璣(150,115)、天衡(150,185)與北極星(150,150)呈一直線 -->
          <g id="polaris">
            <line x1="150" y1="138" x2="150" y2="162" stroke="#a67c37" stroke-width="1.5"/>
            <line x1="138" y1="150" x2="162" y2="150" stroke="#a67c37" stroke-width="1.5"/>
            <circle cx="150" cy="150" r="5" fill="#9e2a2b" stroke="#fdfbf7" stroke-width="1.5"/>
            <text x="158" y="154" font-size="10" fill="#9e2a2b" font-weight="bold">極星</text>
          </g>
        </svg>

        <button class="spin-trigger-btn" id="spinBtn" onclick="divineStep()">擲爻旋運</button>
      </div>
    </div>
  </div>

  <!-- 跳出式資訊視窗 -->
  <div id="dialog-overlay">
    <div class="dialog-card">
      <div class="dialog-header">
        <span class="dialog-star-name" id="diagStarName">角木蛟</span>
        <span class="dialog-quadrant" id="diagQuadrant">東方青龍</span>
      </div>
      <div class="dialog-meta">
        <div><strong>七曜宿相：</strong><span id="diagYao">木 · 蛟</span></div>
        <div><strong>古分野次：</strong><span id="diagDomain">壽星 · 辰</span></div>
      </div>
      <div class="dialog-body" id="diagContent">
        二十八宿之首，其形若角，主生長春榮、號令萬物。
      </div>
      <div class="dialog-footer">
        <button class="dialog-close-btn" onclick="closeDialog()">結束收合</button>
      </div>
    </div>
  </div>

  <script>
    // 依古天文排盤配置 28 禽星（8x8 網格周長為 28 格）
    // 仰觀：左東（青龍）、上南（朱雀）、右西（白虎）、下北（玄武）
    const MANSIONS = [
      // 左邊：東方青龍（下至上，共7格）
      { name: "角木蛟", quad: "東方青龍", type: "spring", yao: "木 · 蛟", domain: "壽星 · 辰", desc: "青龍角首，三春生發之機。《步天歌》云：『南北兩星正直著，中有平道上天田。』主號令雷霆，萬物始萌。" },
      { name: "亢金龍", quad: "東方青龍", type: "spring", yao: "金 · 龍", domain: "壽星 · 辰", desc: "青龍之頸，風行電掣。《星經》謂其受制於綱紀，主天下法度、審察奸邪。" },
      { name: "氐土貉", quad: "東方青龍", type: "spring", yao: "土 · 貉", domain: "大火 · 卯", desc: "青龍之胸乳，根基穩固。《步天歌》：『四星似斗天之根。』主宗室社稷之屏障。" },
      { name: "房日兔", quad: "東方青龍", type: "spring", yao: "日 · 兔", domain: "大火 · 卯", desc: "青龍之腹，為天府天駟。為明堂布政之位，其象通達，日臨房宿，百福駢臻。" },
      { name: "心月狐", quad: "東方青龍", type: "spring", yao: "月 · 狐", domain: "大火 · 卯", desc: "青龍之策，天王正位，內含大火中星。《天官書》警惕熒惑守心，主王者明德修身之驗。" },
      { name: "尾火虎", quad: "東方青龍", type: "spring", yao: "火 · 虎", domain: "析木 · 寅", desc: "青龍之尾，天江交會，九星蜿蜒。主武庫出師、後宮繼嗣，其象威猛熾盛。" },
      { name: "箕水豹", quad: "東方青龍", type: "spring", yao: "水 · 豹", domain: "析木 · 寅", desc: "青龍尾末，八風之府。好出風埃，主播殖揚簸、農時風調，利於收聚與開拓。" },

      // 上邊：南方朱雀（左至右，共7格）
      { name: "井木犴", quad: "南方朱雀", type: "summer", yao: "木 · 犴", domain: "鶉首 · 未", desc: "朱雀之首冠，天泉甘露。主法令清正、平準水利，星明則天下平定、財泉周流。" },
      { name: "鬼金羊", quad: "南方朱雀", type: "summer", yao: "金 · 羊", domain: "鶉首 · 未", desc: "朱雀之目，內具積尸氣。主察幽明、祭祀鬼神，修善德以遠殃咎。" },
      { name: "柳土獐", quad: "南方朱雀", type: "summer", yao: "土 · 獐", domain: "鶉火 · 午", desc: "朱雀之嗉嘴，號稱天庫。主雷雨之會、調和五味，備物致用以應夏長。" },
      { name: "星日馬", quad: "南方朱雀", type: "summer", yao: "日 · 馬", domain: "鶉火 · 午", desc: "朱雀之頸頸，天之七星。《天官書》載其主衣裳文繡、賢良效職，曜氣凌空。" },
      { name: "張月鹿", quad: "南方朱雀", type: "summer", yao: "月 · 鹿", domain: "鶉火 · 午", desc: "朱雀之嗉羽，張席納客之象。主賓客燕享、賜宴宗親，禮樂齊全。" },
      { name: "翼火蛇", quad: "南方朱雀", type: "summer", yao: "火 · 蛇", domain: "鶉尾 · 巳", desc: "朱雀雙翼，二十二星羅列。主天下禮樂、百工呈藝，翼展如雲，聲明遠布。" },
      { name: "軫水蚓", quad: "南方朱雀", type: "summer", yao: "水 · 蚓", domain: "鶉尾 · 巳", desc: "朱雀之尾車，亦主行旅出征。旁附左轄右轄，掌天下喪車軍旅之法度。" },

      // 右邊：西方白虎（上至下，共7格）
      { name: "奎木狼", quad: "西方白虎", type: "autumn", yao: "木 · 狼", domain: "降婁 · 戌", desc: "白虎之尾，天之府庫，形如製鞋。主文章興盛、科名鼎盛，《孝經》謂其主圖書府庫。" },
      { name: "婁金狗", quad: "西方白虎", type: "autumn", yao: "金 · 狗", domain: "降婁 · 戌", desc: "白虎之軀，三星聚眾。主修治苑囿、聚斂農殖，祈祀豐收之星。" },
      { name: "胃土雉", quad: "西方白虎", type: "autumn", yao: "土 · 雉", domain: "大梁 · 酉", desc: "白虎之胃腑，天之大倉。主五穀蓄藏、國阜民安，金匱蓄積之司。" },
      { name: "昴日雞", quad: "西方白虎", type: "autumn", yao: "日 · 雞", domain: "大梁 · 酉", desc: "白虎之膺胸，白虎正位。西方正曜，主刑獄典章、邊境武備，肅殺以立規矩。" },
      { name: "畢月烏", quad: "西方白虎", type: "autumn", yao: "月 · 烏", domain: "實沈 · 申", desc: "白虎之右肋，形如天街。《詩經》：『月離於畢，俾滂沱矣。』主膏雨與邊關之安靖。" },
      { name: "觜火猴", quad: "西方白虎", type: "autumn", yao: "火 · 猴", domain: "實沈 · 申", desc: "白虎之首頂，三星相湊。三星狹小，主管收斂、運送軍需，慎謀而後動。" },
      { name: "參水猿", quad: "西方白虎", type: "autumn", yao: "水 · 猿", domain: "實沈 · 申", desc: "白虎雙肩與足，七曜並立。將軍威武，與東方心宿遙相對應，定金石征討之功。" },

      // 下邊：北方玄武（右至左，共7格）
      { name: "斗木獬", quad: "北方玄武", type: "winter", yao: "木 · 獬", domain: "星紀 · 丑", desc: "玄武之首，北斗之相稱。天之廟堂，主壽命官祿、量度量衡，為萬法宗源。" },
      { name: "牛金牛", quad: "北方玄武", type: "winter", yao: "金 · 牛", domain: "星紀 · 丑", desc: "玄武之身，牽牛之宿。主管耕稼田疇、橋梁津渡，堅忍任重以成大業。" },
      { name: "女土蝠", quad: "北方玄武", type: "winter", yao: "土 · 蝠", domain: "玄枵 · 子", desc: "玄武之龜首，主裁縫織女之職。掌布帛寶玉、配偶婚姻，以靜治動。" },
      { name: "虛日鼠", quad: "北方玄武", type: "winter", yao: "日 · 鼠", domain: "玄枵 · 子", desc: "玄武正位，空曠冥極。主祈求風雪、察民間疾苦，虛心以受至理。" },
      { name: "危月燕", quad: "北方玄武", type: "winter", yao: "月 · 燕", domain: "玄枵 · 子", desc: "玄武之棟宇，天府之顛。主架構宗廟、宗廟防範，思患而預防之象。" },
      { name: "室火豬", quad: "北方玄武", type: "winter", yao: "火 · 豬", domain: "娵訾 · 亥", desc: "玄武之室壘，營室主工師。秋暮定星南中，主興造土木、啟行天下之律。" },
      { name: "壁水貐", quad: "北方玄武", type: "winter", yao: "水 · 貐", domain: "娵訾 · 亥", desc: "玄武尾部，東壁圖書。主秘書典籍、文教弘開，與西奎相銜，周天道圓。" }
    ];

    // 8x8 網格周圍 28 個外圍單元格的座標映射 (row, col)
    const GRID_COORDINATES = [
      // 左邊（下往上，col: 1）
      { r: 7, c: 1 }, { r: 6, c: 1 }, { r: 5, c: 1 }, { r: 4, c: 1 }, { r: 3, c: 1 }, { r: 2, c: 1 }, { r: 1, c: 1 },
      // 上邊（左往右，row: 1）
      { r: 1, c: 2 }, { r: 1, c: 3 }, { r: 1, c: 4 }, { r: 1, c: 5 }, { r: 1, c: 6 }, { r: 1, c: 7 }, { r: 1, c: 8 },
      // 右邊（上往下，col: 8）
      { r: 2, c: 8 }, { r: 3, c: 8 }, { r: 4, c: 8 }, { r: 5, c: 8 }, { r: 6, c: 8 }, { r: 7, c: 8 }, { r: 8, c: 8 },
      // 下邊（右往左，row: 8）
      { r: 8, c: 7 }, { r: 8, c: 6 }, { r: 8, c: 5 }, { r: 8, c: 4 }, { r: 8, c: 3 }, { r: 8, c: 2 }, { r: 8, c: 1 }
    ];

    let currentIndex = 0;
    let currentRotation = 0;
    let isSpinning = false;

    // 棋盤建構
    const boardEl = document.getElementById("board");
    const cellElements = [];

    MANSIONS.forEach((m, idx) => {
      const cell = document.createElement("div");
      cell.className = `cell ${m.type}`;
      cell.style.gridRow = GRID_COORDINATES[idx].r;
      cell.style.gridColumn = GRID_COORDINATES[idx].c;

      const title = document.createElement("div");
      title.className = "cell-title";
      title.innerText = m.name;
      cell.appendChild(title);

      const token = document.createElement("div");
      token.className = "player-token";
      cell.appendChild(token);

      cell.onclick = () => showMansionModal(idx);
      boardEl.appendChild(cell);
      cellElements.push(cell);
    });

    cellElements[0].classList.add("has-token");

    // 計算各星宿格子相對於盤心的精確幾何角度
    function getCellTargetAngle(index) {
      const coord = GRID_COORDINATES[index];
      // 網格中心設在 row: 4.5, col: 4.5
      const dy = coord.r - 4.5;
      const dx = coord.c - 4.5;
      let rad = Math.atan2(dy, dx);
      let deg = rad * (180 / Math.PI);
      return deg;
    }

    // 擲爻啟動天盤逆時鐘旋運
    function divineStep() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      // 隨機決定落點星宿
      const targetIndex = Math.floor(Math.random() * 28);
      
      // 計算目標格子的幾何中心角度
      const targetMansionAngle = getCellTargetAngle(targetIndex);

      // 破軍指針相對於天盤群組中心之原生方位角約為 45 度（x:245, y:295 對於 150,150）
      const pointerNativeAngle = 45;
      
      // 計算使得破軍指針剛好指著 targetMansionAngle 的群組旋轉角度
      let desiredAngle = targetMansionAngle - pointerNativeAngle;
      
      // 規範化當前旋轉角度
      let normalizedCurrent = currentRotation % 360;
      let diff = desiredAngle - normalizedCurrent;
      
      // 術數天道左旋：斗柄必須「逆時鐘旋轉」（角度持續負向遞減）
      while (diff > 0) {
        diff -= 360;
      }
      
      // 至少逆轉 3 整圈以上再煞停
      const extraLaps = 3 * 360;
      currentRotation = currentRotation + diff - extraLaps;

      const rotaryPlate = document.getElementById("rotary-plate");
      rotaryPlate.style.transition = "transform 3.2s cubic-bezier(0.18, 0.89, 0.32, 1)";
      rotaryPlate.style.transformOrigin = "150px 150px";
      rotaryPlate.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        // 更新玩家棋子位置
        cellElements.forEach(c => {
          c.classList.remove("has-token");
          c.classList.remove("targeted");
        });
        
        currentIndex = targetIndex;
        cellElements[currentIndex].classList.add("has-token");
        cellElements[currentIndex].classList.add("targeted");

        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;

        // 旋運停定，啟動對話框顯示該宿詳情
        showMansionModal(currentIndex);
      }, 3300);
    }

    // 開啟星宿詳情對話框
    function showMansionModal(index) {
      const data = MANSIONS[index];
      document.getElementById("diagStarName").innerText = data.name;
      document.getElementById("diagQuadrant").innerText = data.quad;
      document.getElementById("diagYao").innerText = data.yao;
      document.getElementById("diagDomain").innerText = data.domain;
      document.getElementById("diagContent").innerText = data.desc;

      document.getElementById("dialog-overlay").classList.add("active");
    }

    // 關閉對話框
    function closeDialog() {
      document.getElementById("dialog-overlay").classList.remove("active");
    }
  </script>
</body>
</html>
