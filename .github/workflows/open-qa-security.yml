name: Open QA security mock tests
on:
  push:
    branches: ['test/open-qa-security-20261029']
  pull_request:
    paths: ['quiz-open-qa.js','tests/**','playwright.config.cjs','package.json','.github/workflows/open-qa-security.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-qa-security-results
          path: test-results/
          if-no-files-found: ignore
