name: Quiz update notice validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'quiz-update-notice.js'
      - 'supabase/functions/quiz-update-notice/index.ts'
      - 'database/quiz-update-ip-once.sql'
      - 'tests/quiz-update-notice.test.cjs'
      - '.github/workflows/quiz-update-notice.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check quiz-update-notice.js
      - run: node --test tests/quiz-update-notice.test.cjs
