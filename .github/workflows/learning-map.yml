name: Learning map isolated validation
on:
  push:
    paths:
      - 'index.html'
      - 'learning-map.js'
      - 'tests/learning-map.test.cjs'
      - '.github/workflows/learning-map.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'learning-map.js'
      - 'tests/learning-map.test.cjs'
      - '.github/workflows/learning-map.yml'
permissions:
  contents: read
jobs:
  learning-map-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning map JavaScript syntax
        run: node --check learning-map.js
      - name: Run isolated UI and progress checks
        run: node --test tests/learning-map.test.cjs
