name: Nickname beginner ranked access
on:
  pull_request:
    paths:
      - 'database/nickname-beginner-*.sql'
      - 'supabase/functions/quiz-nickname-beginner/**'
      - 'supabase/functions/quiz-guest-trial/**'
      - 'nickname-beginner.js'
      - 'quiz-challenge-v7.js'
      - 'challenge-v8-ui.js'
      - 'challenge-v12-leaderboard.js'
      - 'tests/nickname-beginner*'
      - '.github/workflows/nickname-beginner.yml'
  workflow_dispatch:
jobs:
  nickname-isolated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: nickname_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nickname_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser script and backend security invariants
        run: node --test tests/nickname-beginner.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type safety
        run: deno check supabase/functions/quiz-nickname-beginner/index.ts supabase/functions/quiz-guest-trial/index.ts
      - name: Database isolation, beginner-only scoring, ranking and shared IP
        env:
          PGPASSWORD: testonly
        run: psql -h 127.0.0.1 -U postgres -d nickname_test -v ON_ERROR_STOP=1 -f tests/nickname-beginner-integration.sql
