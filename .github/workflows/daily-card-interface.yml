name: Daily card interface verification
on:
  pull_request:
    paths:
      - 'daily-knowledge-editor-admin.js'
      - 'daily-knowledge-carousel.js'
      - 'tests/daily-card-interface.test.cjs'
      - '.github/workflows/daily-card-interface.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check daily-knowledge-editor-admin.js && node --check daily-knowledge-carousel.js
      - run: node --test tests/daily-card-interface.test.cjs
