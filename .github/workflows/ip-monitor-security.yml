name: IP monitor security checks
on:
  pull_request:
    paths:
      - 'database/ip-monitor-*.sql'
      - 'ip-monitor-admin.js'
      - 'traffic-tracker.js'
      - 'traffic-admin-dashboard.js'
      - 'supabase/functions/quiz-guest-trial/index.ts'
      - 'supabase/functions/quiz-ip-monitor/index.ts'
      - 'tests/ip-monitor/**'
      - '.github/workflows/ip-monitor-security.yml'
  workflow_dispatch:
jobs:
  ip-monitor-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monitor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser/edge security invariants
        run: node --test tests/ip-monitor/ip-monitor.test.cjs
      - name: Test database access, lock, unlock, alerts in isolated Postgres
        env:
          PGPASSWORD: testonly
        run: psql -h 127.0.0.1 -U postgres -d monitor_test -v ON_ERROR_STOP=1 -f tests/ip-monitor/integration.sql
