name: Removed bank rebalance tools verification
on:
  pull_request:
    paths:
      - 'challenge-v9-library-bank.js'
      - 'challenge-v23-bank-tools.js'
      - 'tests/remove-bank-rebalance-tools.test.cjs'
      - '.github/workflows/remove-bank-rebalance.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check challenge-v9-library-bank.js && node --check challenge-v23-bank-tools.js
      - run: node --test tests/remove-bank-rebalance-tools.test.cjs
