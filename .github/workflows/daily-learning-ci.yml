name: Daily challenge learning integration
on:
  push:
    branches: [feature/daily-learning-challenge-20261030]
  pull_request:
    paths:
      - 'challenge-learning.js'
      - 'index.html'
      - 'quiz-challenge-v7.js'
      - 'supabase/29_daily_learning_challenge.sql'
      - 'tests/learning/**'
      - 'tests/ux/learning.spec.js'
      - '.github/workflows/daily-learning-ci.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-learning-ci
          POSTGRES_DB: learning_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-learning-ci
      PGDATABASE: learning_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Load fake auth and answer history
        run: psql -X -v ON_ERROR_STOP=1 -f tests/learning/isolated-setup.sql
      - name: Apply migration in disposable database ONLY
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/29_daily_learning_challenge.sql
      - name: Assert assignments, scoring, isolation, permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/learning/isolated-assert.sql
  mocked-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: |
          node --check ../../challenge-learning.js
          node --check ../../quiz-challenge-v7.js
      - name: Install pinned Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium for isolated mock tests
        run: npx playwright install --with-deps chromium
      - name: Verify all learning hub cases
        run: npx playwright test learning.spec.js --reporter=line
