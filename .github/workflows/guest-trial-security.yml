name: IP guest trial security and Wenchang card
on:
  push:
    branches: [feature/ip-five-attempt-trial-wenchang-card-20261029]
  pull_request:
    paths:
      - quiz-challenge-v7.js
      - index.html
      - trial-wenchang-card.js
      - trial-wenchang-ui.css
      - supabase/27_trial_ip_five_attempts.sql
      - supabase/functions/quiz-guest-trial/**
      - tests/trial/**
      - tests/ux/**
      - .github/workflows/guest-trial-security.yml
permissions:
  contents: read
jobs:
  postgres-atomic-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: guest_trial_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d guest_trial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: guest_trial_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create dummy service-role and fake questions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/trial/postgres-fixture.sql
      - name: Apply proposed schema only to test DB
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/27_trial_ip_five_attempts.sql
      - name: Validate atomic five-attempt limit and privileges
        run: psql -X -v ON_ERROR_STOP=1 -f tests/trial/postgres-security.sql
  edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/quiz-guest-trial/index.ts
      - run: node --check trial-wenchang-card.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
