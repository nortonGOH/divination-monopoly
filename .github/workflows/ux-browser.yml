name: Website UX browser tests
on:
  push:
    branches: ['ux/mobile-navigation-accessibility-20261029']
  pull_request:
    paths: ['index.html','site-ux.css','site-ux.js','tests/ux/**','.github/workflows/ux-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-ux-playwright-results
          path: tests/ux/test-results/
          if-no-files-found: ignore
