name: Guestbook security and browser checks
on:
  push:
    branches: [feature/member-guestbook-wenchang-awards-20261029]
  pull_request:
    paths:
      - guestbook.js
      - guestbook.css
      - index.html
      - quiz-challenge-v7.js
      - supabase/26_member_guestbook_wenchang_grants.sql
      - tests/guestbook/**
      - tests/ux/**
      - .github/workflows/guestbook-security.yml
permissions:
  contents: read
jobs:
  postgres-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: guestbook_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d guestbook_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-isolated-only
      PGDATABASE: guestbook_ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create isolated Auth and wallet fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/guestbook/postgres-fixture.sql
      - name: Apply proposed guestbook migration in isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/26_member_guestbook_wenchang_grants.sql
      - name: Verify owner, administrator, bonus and audit permission boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tests/guestbook/postgres-security.sql
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guestbook-browser-test-results
          path: tests/ux/test-results/
          if-no-files-found: ignore
